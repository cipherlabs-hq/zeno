name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The "Version packages" pull request is opened by GitHub Actions, and GitHub
  # does not start workflows for those. Run this by hand on that branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The browser the element and example tests run in.
      - run: pnpm --filter @usezeno/core exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      # Fails when the generated React, Vue or Svelte bindings are out of date.
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm test
      # Fails when a package tarball carries tests, stories, secrets or a broken export.
      - run: pnpm release:check
      - run: pnpm build-storybook
      - run: pnpm docs:build
